{% extends "base.html" %}

{% block title %}Carga Combustible - Unidad {{ v['ID'] }}{% endblock %}

{% block content %}
<div class="banner banner-ficha"></div>

<div class="kiosk-container">
    <div class="kiosk-content">
        <h2 style="color:var(--orange); margin-top:0; margin-bottom:20px;">⛽ CARGA COMBUSTIBLE</h2>
        {% include "components/unit_header.html" %}

        <form method="POST" class="vertical-form">
            <div class="form-group">
                <label class="form-label" style="font-weight:bold; font-size:13px; color:#555;">Tipo de Combustible</label>
                <select name="tipo" class="form-select">
                    <option>DIESEL (GASOIL)</option>
                    <option>NAFTA</option>
                    <option>GNC</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label" style="font-weight:bold; font-size:13px; color:#555;">Carga en Litros</label>
                <input type="number" min="0" step="0.1" name="litros" class="form-input" required placeholder="0.0">
            </div>
            <div class="form-group">
                <label class="form-label" style="font-weight:bold; font-size:13px; color:#555;">Marca del Odómetro de Unidad</label>
                <input type="number" min="0" name="km" class="form-input" required placeholder="Ej: 154000">
            </div>
            <button type="submit" class="big-btn btn-orange" style="margin-top:10px;">REGISTRAR CARGA</button>
        </form>
    </div>
</div>
{% endblock %}
