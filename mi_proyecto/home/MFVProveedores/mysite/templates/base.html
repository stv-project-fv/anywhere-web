<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Flota V2.0</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet">
    
    <style>
        :root {
            --primary: #009B77;
            --secondary: #DAA520;
            --danger: #dc3545;
            --success: #28a745;
        }
        body { background-color: #f4f6f9; font-family: 'Segoe UI', sans-serif; }
        .banner { height: 120px; background-size: cover; background-position: center; border-bottom: 5px solid var(--secondary); margin-bottom: 20px;}
        .banner-panel { background-image: url('https://i.ibb.co/Fq6mSJgm/Secretar-a-de-Obras-Servicios-P-blicos-Ambiente-y-Planificaci-n-Urbana.png'); }
        
        .card-custom { border: none; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .btn-xl { padding: 15px 20px; font-size: 18px; font-weight: bold; width: 100%; border-radius: 8px; }
        
        /* Estilos específicos de tu diseño anterior */
        .status-badge { padding: 5px 10px; border-radius: 5px; font-weight: bold; color: white; text-transform: uppercase; font-size: 12px; }
        .bg-ok { background-color: var(--success); }
        .bg-bad { background-color: var(--danger); }
        
        /* Input invisible para NFC */
        .nfc-input { opacity: 0; position: absolute; top: -1000px; }
        .nfc-waiting { border: 3px dashed #ccc; padding: 30px; text-align: center; border-radius: 10px; background: #fff; cursor: pointer; }
        .nfc-waiting:hover { border-color: var(--primary); background: #f0fdf4; }
    </style>
</head>
<body>
    <div class="banner banner-panel"></div>
    
    <div class="container pb-5">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ 'danger' if category == 'error' else 'success' }} alert-dismissible fade show">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
